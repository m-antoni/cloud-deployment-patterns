# ============================================================
# Scheduled Cleanup (global scheduler)
# ============================================================
# Tears down deployed stacks automatically every night to avoid
# idle AWS charges. Runs from the DEFAULT branch (master).
#
# Currently handled:
#   - Release AWS SAM (dev): full stack teardown at 12:00 AM Asia/Singapore
# Future: add jobs for 01 (AWS Console) and 03 (Terraform).
#
# Manual test (DESTRUCTIVE - deletes the whole dev stack):
#   Actions -> "Scheduled Cleanup" -> Run workflow
# ============================================================

name: Scheduled Cleanup

on:
  schedule:
    - cron: "0 15 * * *" # 12:00 AM Asia/Singapore (15:00 UTC, +1h GitHub scheduler delay)
  workflow_dispatch: {} # on-demand test of the same job

jobs:
  cleanup-02-aws-sam:
    runs-on: ubuntu-latest
    environment: release-dev-aws-sam # AWS + mail secrets for the 02 pattern
    defaults:
      run:
        working-directory: 02-deploy-using-aws-sam
    steps:
      - name: Notify - Cleanup started
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SMTP_SERVER }}
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Cleanup STARTED - Release AWS SAM (dev)"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            Scheduled SAM cleanup started.
            Repository: ${{ github.repository }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run cleanup (dev)
        run: bash .scripts/cleanup.sh --env dev --yes

      - name: Notify - Cleanup result
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SMTP_SERVER }}
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ job.status == 'success' && 'Cleanup SUCCESS - Release AWS SAM (dev)' || 'Cleanup FAILED - Release AWS SAM (dev)' }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM }}
          body: |
            Status: ${{ job.status }}
            Repository: ${{ github.repository }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
